# ─────────────────────────────────────────────────────────────────────────────
# Naveda Integra — Roles & Permissions Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# This TOML file is the single source of truth for all available roles and
# permissions in the project.  The management command `sync_roles_permissions`
# reads this file and upserts the database accordingly.
#
# Roles and permissions defined here are referenced in views and templates.
# Authorization checks should use `user.has_ni_perm('permission_code')` rather
# than role-based checks for granular control.
#
# ─────────────────────────────────────────────────────────────────────────────

# ── Roles ────────────────────────────────────────────────────────────────────
# Each role has a code, display name, and description.
# The `default_permissions` list assigns permissions automatically when a
# user is given this role (can be overridden per-user).

[[roles]]
code = "admin"
name = "Admin"
description = "Full access to all features and all business entities."
default_permissions = [
    "user_view", "user_create", "user_update", "user_delete",
    "user_manage_permissions",
    "entitas_bisnis_view", "entitas_bisnis_create", "entitas_bisnis_update", "entitas_bisnis_delete",
    "master_data_view", "master_data_create", "master_data_update", "master_data_delete",
    "purchase_view", "purchase_create", "purchase_update", "purchase_delete",
    "inventory_view",
    "jurnal_view", "jurnal_create", "jurnal_update", "jurnal_delete",
    "sales_view", "sales_create", "sales_update", "sales_delete",
    "piutang_view", "piutang_create", "piutang_update", "piutang_delete",
    "report_view",
    "settings_view", "settings_update",
]

[[roles]]
code = "operator"
name = "Operator"
description = "Same as Admin but some admin-only menus are hidden."
default_permissions = [
    "entitas_bisnis_view", "entitas_bisnis_create", "entitas_bisnis_update",
    "master_data_view", "master_data_create", "master_data_update",
    "purchase_view", "purchase_create", "purchase_update", "purchase_delete",
    "inventory_view",
    "jurnal_view", "jurnal_create", "jurnal_update",
    "sales_view", "sales_create", "sales_update",
    "piutang_view", "piutang_create", "piutang_update",
    "report_view",
    "settings_view",
]

[[roles]]
code = "business_owner"
name = "Pemilik Bisnis"
description = "Can only see/manage data for linked EntitasBisnis."
default_permissions = [
    "entitas_bisnis_view",
    "master_data_view",
    "purchase_view", "purchase_create", "purchase_update",
    "inventory_view",
    "jurnal_view",
    "sales_view", "sales_create", "sales_update",
    "piutang_view", "piutang_create", "piutang_update",
    "report_view",
]

[[roles]]
code = "business_employee"
name = "Karyawan Bisnis"
description = "Same as Business Owner but with restricted write access."
default_permissions = [
    "entitas_bisnis_view",
    "master_data_view",
    "purchase_view",
    "inventory_view",
    "jurnal_view",
    "sales_view",
    "piutang_view",
    "report_view",
]


