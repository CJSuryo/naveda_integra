{% extends 'base.html' %}
{% block title %}Buka Shift{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">Buka Shift</h1>
    <p class="ni-page-header__subtitle">{{ store.entitas_bisnis_lv2.nama }}</p>
  </div>
</div>

{% for msg in messages %}<div class="ni-alert ni-alert--{{ msg.tags }}">{{ msg }}</div>{% endfor %}

<div class="ni-card ni-animate-fade-in" style="max-width:480px;">
  <div class="ni-card__body">
    <form method="post">
      {% csrf_token %}
      <div class="ni-form-group">
        <label class="ni-form-label">Shift <span style="color:var(--ni-danger)">*</span></label>
        <select name="shift" class="ni-input" required>
          <option value="">— Pilih Shift —</option>
          {% for shift in shifts %}
          <option value="{{ shift.pk }}">{{ shift.name }} ({{ shift.start_time|time:"H:i" }}–{{ shift.end_time|time:"H:i" }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="ni-form-group">
        <label class="ni-form-label">Kas Awal (Rp)</label>
        <input type="number" name="opening_cash" class="ni-input" value="0" min="0" step="1000">
      </div>
      <div class="ni-btn-row" style="margin-top:24px;">
        <button type="submit" class="ni-btn ni-btn--primary">
          <i data-lucide="play" style="width:16px;height:16px"></i> Buka Shift
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
