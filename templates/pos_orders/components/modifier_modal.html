<div id="modifier-modal" class="ni-modal" style="display:none">
  <div class="ni-modal-overlay"></div>
  <div class="ni-modal-content">
    <div class="ni-modal-header">
      <h2 id="modifier-product-name">Pilih Opsi</h2>
      <button id="close-modifier-modal" class="ni-modal-close"><i data-lucide="x"></i></button>
    </div>
    <div class="ni-modal-body" id="modifier-groups-container"></div>
    <div class="ni-modal-footer">
      <div class="pos-qty-row">
        <button id="modifier-qty-minus" class="ni-btn ni-btn-sm ni-btn-secondary">−</button>
        <span id="modifier-qty-display">1</span>
        <button id="modifier-qty-plus" class="ni-btn ni-btn-sm ni-btn-secondary">+</button>
      </div>
      <input type="text" id="modifier-item-notes" class="ni-input" placeholder="Catatan (opsional)">
      <button id="confirm-add-item-btn" class="ni-btn ni-btn-primary">Tambahkan ke Pesanan</button>
    </div>
  </div>
</div>
