<div id="payment-modal" class="ni-modal" style="display:none">
  <div class="ni-modal-overlay"></div>
  <div class="ni-modal-content">
    <div class="ni-modal-header">
      <h2>Pembayaran</h2>
      <button id="close-payment-modal" class="ni-modal-close"><i data-lucide="x"></i></button>
    </div>
    <div class="ni-modal-body">
      <div class="pos-payment-total">Total: <strong id="modal-total">Rp 0</strong></div>
      <div id="payment-method-buttons" class="pos-payment-methods"></div>
      <div id="payment-rows" class="pos-payment-rows"></div>
      <div id="cash-change-section" style="display:none">
        <label class="ni-label">Uang Diterima</label>
        <input type="number" id="cash-received" class="ni-input" step="1000">
        <div class="pos-change">Kembalian: <strong id="cash-change">Rp 0</strong></div>
      </div>
      <div id="qris-section" style="display:none">
        <img id="qris-image" src="" alt="QRIS" style="max-width:200px;display:block;margin:auto">
        <button id="confirm-qris-btn" class="ni-btn ni-btn-success" style="width:100%;margin-top:1rem">
          Konfirmasi Pembayaran Diterima
        </button>
      </div>
      <div id="transfer-section" style="display:none">
        <label class="ni-label">No. Referensi Transfer</label>
        <input type="text" id="transfer-ref" class="ni-input" placeholder="Contoh: TRF12345">
        <button id="confirm-transfer-btn" class="ni-btn ni-btn-success" style="width:100%;margin-top:.5rem">
          Konfirmasi Diterima
        </button>
      </div>
    </div>
    <div class="ni-modal-footer">
      <button id="complete-order-btn" class="ni-btn ni-btn-primary" disabled>
        <i data-lucide="check-circle"></i> Selesaikan Pesanan
      </button>
    </div>
  </div>
</div>
