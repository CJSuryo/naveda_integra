{% url 'pos_reports_dashboard' as url_dash %}
{% url 'pos_reports_daily' as url_daily %}
{% url 'pos_reports_top_products' as url_top %}
{% url 'pos_reports_payments' as url_pay %}
{% url 'pos_reports_laba_rugi' as url_lr %}
<nav style="display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--ni-border);">
  <a href="{{ url_dash }}{% if store %}?store={{ store.pk }}{% endif %}"
     class="ni-tab{% if request.resolver_match.url_name == 'pos_reports_dashboard' %} ni-tab--active{% endif %}"
     style="padding:10px 18px;text-decoration:none;font-size:0.875rem;font-weight:500;color:var(--ni-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;{% if request.resolver_match.url_name == 'pos_reports_dashboard' %}color:var(--ni-primary);border-bottom-color:var(--ni-primary);{% endif %}">Dashboard</a>
  <a href="{{ url_daily }}{% if store %}?store={{ store.pk }}{% endif %}"
     class="ni-tab{% if request.resolver_match.url_name == 'pos_reports_daily' %} ni-tab--active{% endif %}"
     style="padding:10px 18px;text-decoration:none;font-size:0.875rem;font-weight:500;color:var(--ni-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;{% if request.resolver_match.url_name == 'pos_reports_daily' %}color:var(--ni-primary);border-bottom-color:var(--ni-primary);{% endif %}">Harian</a>
  <a href="{{ url_top }}{% if store %}?store={{ store.pk }}{% endif %}"
     class="ni-tab{% if request.resolver_match.url_name == 'pos_reports_top_products' %} ni-tab--active{% endif %}"
     style="padding:10px 18px;text-decoration:none;font-size:0.875rem;font-weight:500;color:var(--ni-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;{% if request.resolver_match.url_name == 'pos_reports_top_products' %}color:var(--ni-primary);border-bottom-color:var(--ni-primary);{% endif %}">Top Produk</a>
  <a href="{{ url_pay }}{% if store %}?store={{ store.pk }}{% endif %}"
     class="ni-tab{% if request.resolver_match.url_name == 'pos_reports_payments' %} ni-tab--active{% endif %}"
     style="padding:10px 18px;text-decoration:none;font-size:0.875rem;font-weight:500;color:var(--ni-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;{% if request.resolver_match.url_name == 'pos_reports_payments' %}color:var(--ni-primary);border-bottom-color:var(--ni-primary);{% endif %}">Pembayaran</a>
  <a href="{{ url_lr }}{% if store %}?store={{ store.pk }}{% endif %}"
     class="ni-tab{% if request.resolver_match.url_name == 'pos_reports_laba_rugi' %} ni-tab--active{% endif %}"
     style="padding:10px 18px;text-decoration:none;font-size:0.875rem;font-weight:500;color:var(--ni-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;{% if request.resolver_match.url_name == 'pos_reports_laba_rugi' %}color:var(--ni-primary);border-bottom-color:var(--ni-primary);{% endif %}">Laba/Rugi</a>
</nav>
