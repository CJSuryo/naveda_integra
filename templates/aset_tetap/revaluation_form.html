{% extends 'base.html' %}
{% block title %}Tambah Revaluasi{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">Tambah Revaluasi</h1>
    <p class="ni-page-header__subtitle">Catat revaluasi nilai wajar aset tetap</p>
  </div>
  <div class="ni-page-header__actions">
    <a href="{% url 'aset_tetap:revaluation_list' %}" class="ni-btn ni-btn--secondary">
      <i data-lucide="arrow-left" style="width:16px;height:16px"></i> Kembali
    </a>
  </div>
</div>

<div class="ni-card ni-animate-fade-in" style="max-width:700px;">
  <div class="ni-card__body">
    {% if warning %}
    <div style="background:#fffbeb;border:1px solid #fbbf24;color:#92400e;border-radius:var(--ni-radius);padding:12px 16px;margin-bottom:16px;font-size:0.875rem;">
      <i data-lucide="alert-triangle" style="width:14px;height:14px;vertical-align:text-bottom;"></i>
      {{ warning }}
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="ni-btn-row" style="margin-top:24px;">
        <button type="submit" class="ni-btn ni-btn--primary">Simpan</button>
        <a href="{% url 'aset_tetap:revaluation_list' %}" class="ni-btn ni-btn--secondary">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
