{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">{{ title }}</h1>
  </div>
</div>
<div class="ni-card ni-animate-fade-in">
  <div class="ni-card__body">
    <form method="post">{% csrf_token %}
      {% for field in form %}
      <div class="ni-form-group">
        <label class="ni-form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="ni-form-error">{{ field.errors }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="ni-btn-row">
        <button type="submit" class="ni-btn ni-btn--primary"><i data-lucide="save" style="width:16px;height:16px"></i> Simpan</button>
        <a href="{% url 'jurnal:prefix_list' %}" class="ni-btn ni-btn--secondary">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
