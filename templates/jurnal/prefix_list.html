{% extends 'base.html' %}
{% block title %}Prefiks Transaksi{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">Prefiks Transaksi</h1>
  </div>
  <div class="ni-page-header__actions">
    <a href="{% url 'jurnal:prefix_create' %}" class="ni-btn ni-btn--success"><i data-lucide="plus" style="width:16px;height:16px"></i> Tambah</a>
  </div>
</div>
<div class="ni-card ni-animate-fade-in">
  <div class="ni-card__body">
    <div class="ni-table-wrapper">
      <table class="ni-table">
        <thead><tr><th>Kode</th><th>Nama</th><th>Aksi</th></tr></thead>
        <tbody>
          {% for obj in object_list %}
          <tr>
            <td>{{ obj.kode }}</td>
            <td>{{ obj.nama }}</td>
            <td>
              <div class="ni-btn-row">
                <a href="{% url 'jurnal:prefix_update' obj.pk %}" class="ni-btn ni-btn--warning ni-btn--sm">Edit</a>
                <a href="{% url 'jurnal:prefix_delete' obj.pk %}" class="ni-btn ni-btn--danger ni-btn--sm">Hapus</a>
              </div>
            </td>
          </tr>
          {% empty %}<tr><td colspan="3" class="ni-text-center ni-text-muted">Belum ada data.</td></tr>{% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
