{% extends 'base.html' %}
{% block title %}Item{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">Item</h1>
  </div>
  <div class="ni-page-header__actions">
    <a href="{% url 'jurnal:item_create' %}" class="ni-btn ni-btn--success"><i data-lucide="plus" style="width:16px;height:16px"></i> Tambah</a>
  </div>
</div>
<div class="ni-card ni-animate-fade-in">
  <div class="ni-card__body">
    <div class="ni-table-wrapper">
      <table class="ni-table">
        <thead><tr><th>Kode</th><th>Nama</th><th>Aksi</th></tr></thead>
        <tbody>
          {% for obj in object_list %}
          <tr>
            <td>{{ obj.kode }}</td>
            <td>{{ obj.nama }}</td>
            <td>
              <div class="ni-btn-row">
                <a href="{% url 'jurnal:item_update' obj.pk %}" class="ni-btn ni-btn--warning ni-btn--sm">Edit</a>
                <button type="button" class="ni-btn ni-btn--danger ni-btn--sm" onclick="openDeleteModal('{% url 'jurnal:item_delete' obj.pk %}', '{{ obj.nama|escapejs }}')">Hapus</button>
              </div>
            </td>
          </tr>
          {% empty %}<tr><td colspan="3" class="ni-text-center ni-text-muted">Belum ada data.</td></tr>{% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="ni-modal-backdrop" id="deleteModal">
  <div class="ni-modal ni-modal--sm">
    <div class="ni-modal__header">
      <h3 class="ni-modal__title">Konfirmasi Hapus</h3>
      <button class="ni-modal__close" type="button" onclick="closeDeleteModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="ni-modal__body" style="text-align:center;padding:24px;">
      <div style="width:48px;height:48px;border-radius:50%;background:#fef2f2;color:var(--ni-danger);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
        <i data-lucide="trash-2" style="width:24px;height:24px"></i>
      </div>
      <p style="color:var(--ni-text);margin-bottom:0;">Hapus <strong id="deleteModalName"></strong>?</p>
    </div>
    <div class="ni-modal__footer">
      <form id="deleteModalForm" method="post" action="">
        {% csrf_token %}
        <div class="ni-btn-row" style="justify-content:center;">
          <button type="submit" class="ni-btn ni-btn--danger">Ya, Hapus</button>
          <button type="button" class="ni-btn ni-btn--secondary" onclick="closeDeleteModal()">Batal</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
function openDeleteModal(url, name) {
  document.getElementById('deleteModalForm').action = url;
  document.getElementById('deleteModalName').textContent = name;
  document.getElementById('deleteModal').classList.add('ni-modal-backdrop--visible');
}
function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('ni-modal-backdrop--visible');
}
</script>
{% endblock %}
