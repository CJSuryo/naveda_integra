{% extends 'base.html' %}
{% block title %}Hapus Entitas Bisnis{% endblock %}
{% block content %}
<h2>Hapus Entitas Bisnis</h2>
<p>Apakah Anda yakin ingin menghapus <strong>{{ object.nama }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Ya, Hapus</button>
  <a href="{% url 'entitas_bisnis:list' %}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
