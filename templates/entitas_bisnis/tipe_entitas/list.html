{% extends 'base.html' %}
{% block title %}Tipe Entitas{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">Tipe Entitas</h1>
    <p class="ni-page-header__subtitle">Kelola tipe entitas bisnis</p>
  </div>
  <div class="ni-page-header__actions">
    <a href="{% url 'entitas_bisnis:tipe_entitas_create' %}" class="ni-btn ni-btn--success">
      <i data-lucide="plus" style="width:16px;height:16px"></i> Tambah
    </a>
  </div>
</div>
<div class="ni-card ni-animate-fade-in">
  <div class="ni-table-wrapper">
    <table class="ni-table">
      <thead>
        <tr><th>Nama</th><th>Aksi</th></tr>
      </thead>
      <tbody>
        {% for obj in object_list %}
        <tr>
          <td>{{ obj.nama }}</td>
          <td>
            <div class="ni-btn-row">
              <a href="{% url 'entitas_bisnis:tipe_entitas_update' obj.pk %}" class="ni-btn ni-btn--warning ni-btn--sm">Edit</a>
              <a href="{% url 'entitas_bisnis:tipe_entitas_delete' obj.pk %}" class="ni-btn ni-btn--outline-danger ni-btn--sm">Hapus</a>
            </div>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="2" class="ni-text-center ni-text-muted">Belum ada data.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
