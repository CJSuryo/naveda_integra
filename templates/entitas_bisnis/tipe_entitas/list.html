{% extends 'base.html' %}
{% block title %}Tipe Entitas{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Tipe Entitas</h2>
  <a href="{% url 'entitas_bisnis:tipe_entitas_create' %}" class="btn btn-success">+ Tambah</a>
</div>
<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr><th>Nama</th><th>Aksi</th></tr>
  </thead>
  <tbody>
    {% for obj in object_list %}
    <tr>
      <td>{{ obj.nama }}</td>
      <td>
        <a href="{% url 'entitas_bisnis:tipe_entitas_update' obj.pk %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'entitas_bisnis:tipe_entitas_delete' obj.pk %}" class="btn btn-sm btn-danger">Hapus</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="2" class="text-center">Belum ada data.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
