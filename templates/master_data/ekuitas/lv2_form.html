{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }} <small class="text-muted">({{ parent }})</small></h2>
<form method="post">{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
  <button type="submit" class="btn btn-primary">Simpan</button>
  <a href="{% url 'master_data:ekuitas_lv1_detail' parent.pk %}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
