{% extends 'base.html' %}
{% block title %}Tipe Transaksi{% endblock %}
{% block content %}
<div class="ni-page-header">
  <div>
    <h1 class="ni-page-header__title">Tipe Transaksi</h1>
    <p class="ni-page-header__subtitle">Daftar tipe transaksi (read-only)</p>
  </div>
</div>
<div class="ni-card ni-animate-fade-in">
  <div class="ni-table-wrapper">
    <table class="ni-table">
      <thead><tr><th>Kode</th><th>Nama</th></tr></thead>
      <tbody>
        {% for obj in object_list %}
        <tr>
          <td>{{ obj.kode_transaksi }}</td>
          <td>{{ obj.nama }}</td>
        </tr>
        {% empty %}<tr><td colspan="2" class="ni-text-center ni-text-muted">Belum ada data.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
