{% extends 'base.html' %}
{% block title %}Tipe Transaksi{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Tipe Transaksi</h2>
  <a href="{% url 'master_data:tipe_transaksi_create' %}" class="btn btn-success">+ Tambah</a>
</div>
<table class="table table-striped table-hover">
  <thead class="table-dark"><tr><th>Kode</th><th>Nama</th><th>Aksi</th></tr></thead>
  <tbody>
    {% for obj in object_list %}
    <tr>
      <td>{{ obj.kode_transaksi }}</td>
      <td>{{ obj.nama }}</td>
      <td>
        <a href="{% url 'master_data:tipe_transaksi_update' obj.pk %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'master_data:tipe_transaksi_delete' obj.pk %}" class="btn btn-sm btn-danger">Hapus</a>
      </td>
    </tr>
    {% empty %}<tr><td colspan="3" class="text-center">Belum ada data.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
