# Render Blueprint — one-click deploy for Naveda Integra
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to your repo.
#   2. Go to https://dashboard.render.com/blueprints → New Blueprint Instance.
#   3. Connect your GitHub repo; Render reads this file automatically.
#   4. Set the required env vars (DATABASE_URL, SECRET_KEY) in the dashboard.

services:
  # ── Web Service ──────────────────────────────────────────────────────────────
  - type: web
    name: naveda-integra
    runtime: python
    region: singapore        # match your Neon.tech region
    plan: free
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn naveda_integra.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: naveda_integra.settings.production
      - key: WEB_CONCURRENCY
        value: "4"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # must be set manually (Neon connection string)
      - key: ALLOWED_HOSTS
        sync: false          # e.g. naveda-integra.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # e.g. https://naveda-integra.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST_USER
        sync: false          # Google Workspace mailbox, e.g. noreply@navedafinance.com
      - key: EMAIL_HOST_PASSWORD
        sync: false          # 16-char Gmail App Password
      - key: DEFAULT_FROM_EMAIL
        sync: false          # e.g. Naveda Finance <noreply@navedafinance.com>
      - key: REDIS_URL
        sync: false          # Redis connection string (e.g. Render Key Value / Upstash)
      - key: GLOBAL_THROTTLE_ENABLE
        value: "True"

